<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register - SkillEdge</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<nav>

    <div class="logo">
        Skill<span>Edge</span>
    </div>

</nav>


<section class="auth-section">

    <div class="auth-card">

        <div class="badge">
            CREATE ACCOUNT
        </div>

        <h1>
            Join <span>ResumeAI</span>
        </h1>

        <p>
            Create an account to start your
            AI-powered career journey.
        </p>


        {% if error %}

        <div class="error-message">
            {{ error }}
        </div>

        {% endif %}


        <form action="/register"
              method="POST">

            <label>Name</label>

            <input type="text"
                   name="name"
                   placeholder="Enter your name"
                   required>


            <label>Email</label>

            <input type="email"
                   name="email"
                   placeholder="Enter your email"
                   required>


            <label>Password</label>

            <input type="password"
                   name="password"
                   placeholder="Create a password"
                   required>


            <button type="submit">
                Create Account
            </button>

        </form>


        <p class="auth-link">

            Already have an account?

            <a href="/login">
                Login
            </a>

        </p>

    </div>

</section>


</body>

</html>
